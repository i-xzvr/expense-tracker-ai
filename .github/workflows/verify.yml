name: Verify V4
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-V4Installer.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Setup-V3.ps1 -RuntimeOnly -NoAI
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Test-V4ClaudeInstall.ps1
      - run: npx playwright install chromium
      - run: npm run test:browser
        env:
          NEXT_TELEMETRY_DISABLED: '1'
